{% extends "home/base.html" %}

{% block titulo %}Detalhes do Usuário{% endblock %}

{% block conteudo %}
<div class="container-fluid px-0"> 
    <div class="row justify-content-center">
        <div class="col-12"> 
            <div class="card border-0 shadow-sm mt-2">
                
                <div class="card-header text-white fw-bold py-3" style="background-color: var(--ifpi-verde);">
                    <h5 class="mb-0"><i class="fas fa-id-card me-2"></i> Detalhes do Usuário</h5>
                </div>
                
                <div class="card-body p-4">
                    <div class="row">
                        <div class="col-md-2 mb-3">
                            <label class="form-label fw-bold">ID</label>
                            <input type="text" class="form-control bg-light" value="{{ usuario.id }}" readonly>
                        </div>
                        <div class="col-md-10 mb-3">
                            <label class="form-label fw-bold">Nome Completo</label>
                            <input type="text" class="form-control bg-light" value="{{ usuario.nome }}" readonly>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Matrícula</label>
                            <input type="text" class="form-control bg-light" value="{{ usuario.matricula }}" readonly>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Vínculo Institucional</label>
                            <input type="text" class="form-control bg-light" value="{{ usuario.get_vinculo_display }}" readonly>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Telefone</label>
                            <input type="text" class="form-control bg-light" value="{{ usuario.telefone }}" readonly>
                        </div>
                    </div>

                    <!-- Linha do e-mail expandida para ocupar o espaço que era da senha -->
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label class="form-label fw-bold">E-mail</label>
                            <input type="text" class="form-control bg-light" value="{{ usuario.email }}" readonly>
                        </div>
                    </div>

                    <hr class="mt-4 mb-4">

                    <div class="d-flex justify-content-start">
                        <a href="{% url 'listar_usuario' %}"class="btn btn-secondary shadow-sm px-4 text-white">
                                     <i class="fas fa-chevron-left me-2"></i> Voltar para Listagem
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock conteudo %}

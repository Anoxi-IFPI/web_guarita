{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operação Rápida - Gestão de Chaves IFPI</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!--Arquivo Local Desing pagina inicial -->
    <link rel="stylesheet" href="{% static 'operacaorapida/desing_pagina/inicial.css' %}">

</head>
<body>
    <header class="header-top">
        <div class="logo-area">
            <div class="icon"><i class="fas fa-key"></i></div>
            <h1>IFPI <span>| Operação Rápida</span></h1>
        </div>
        <div class="header-actions">
            <span class="time" id="currentTime"></span>
            <a href="{% url 'painel_admin' %}" class="btn-sair"><i class="fas fa-sign-out-alt"></i> Sair</a>
        </div>
    </header>

    <!-- ÁREA DE MENSAGENS FLUTUANTES -->
    <div class="mensagens-flutuantes">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow" role="alert">
                    <i class="fas fa-info-circle me-2"></i> {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <div class="main-container container-fluid">
        
        <div class="cards-grid">
            
            <!-- 1. FORMULÁRIO DE EMPRÉSTIMO -->
            <div class="card-operacao card-emprestimo">
                <div class="card-header-title">
                    <i class="fas fa-upload"></i> Empréstimo
                </div>
                
                <div class="form-wrapper">
                    <form method="POST" action="{% url 'cadastrar_emprestimo' %}">
                        {% csrf_token %}
                        <input type="hidden" name="origem" value="rapida">
                        
                        <div class="form-group">
                            <label><i class="fas fa-id-card"></i> Matrícula (SUAP)</label>
                            <div class="input-group-custom">
                                <input type="text" name="matricula" placeholder="Ex: 2023112lcom0011" required autofocus autocomplete="off">
                                <button type="submit" class="btn-enter">
                                    <i class="fas fa-arrow-right"></i> Entrar
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 2. FORMULÁRIO DE DEVOLUÇÃO -->
        <div class="card-operacao card-devolver">
            <div class="card-header-title">
                <i class="fas fa-download"></i> Devolver
            </div>
            
            <div class="form-wrapper">
                <!-- IDs adicionados para o JS interceptar e action removida -->
                <form id="form-devolucao-rapida">
                    <div class="form-group">
                        <label><i class="fas fa-barcode"></i> Leia ou digite o código</label>
                        <!-- ID input-codigo-devolucao adicionado -->
                        <input type="text" id="input-codigo-devolucao" name="codigo" class="input-simple" placeholder="Código da chave para devolver" required autocomplete="off">
                    </div>
                    
                    <button type="submit" class="btn-confirmar-verde">
                        <i class="fas fa-check"></i> Confirmar Devolução
                    </button>
                </form>

                <!-- Box "Chaves devolvidas" logo abaixo -->
                <div class="box-chaves-emprestadas">
                    <label style="font-size:13px; font-weight:600; color:#64748b; display:block; margin-bottom: 6px;">
                        <i class="fas fa-list"></i> Devoluções
                    </label>
                    <!-- ID lista-chaves-devolvidas adicionado para o JS injetar o card -->
                    <div id="lista-chaves-devolvidas">
                        <!-- ID msg-lista-vazia adicionado para o JS apagar o texto -->
                        <div class="lista-vazia" id="msg-lista-vazia">Nenhuma chave devolvida ainda</div>
                    </div>
                </div>
            </div>
        </div>

    </div>
        <!-- TASKBAR INFERIOR -->
        <div class="taskbar mt-3">
            <button class="btn-taskbar btn-repassar">
                <i class="fas fa-exchange-alt"></i> Repassar
            </button>
            <button class="btn-taskbar btn-historico">
                <i class="fas fa-history"></i> Histórico
            </button>

            <a href="{% url 'listar_emprestimos' %}" class="btn-taskbar" style="background-color: var(--ifpi-verde); margin-left: 8px;">
                <i class="fas fa-list-ul"></i> Empréstimos Ativos
            </a>
            <div class="admin-wrapper">
                <div class="separator" style="margin-right: 16px;"></div>
                <a href="{% url 'painel_admin' %}" class="btn-taskbar btn-admin">
                    <i class="fas fa-cog"></i> Admin
                </a>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
<script src="{% static 'operacaorapida/devolucao/devolucao.js' %}"></script>
<script src="{% static 'operacaorapida/emprestimo/emprestimo.js' %}"></script>

</body>
</html>

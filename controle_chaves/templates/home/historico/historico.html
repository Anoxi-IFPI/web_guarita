{% extends "home/base.html" %}
{% load static %}

{% block titulo %}Histórico de Movimentações{% endblock %}

{% block conteudo %}
<div class="container-fluid mt-2">
    <div class="card shadow mb-4 border-0">
        <div class="card-header py-3 text-white fw-bold d-flex justify-content-between align-items-center flex-wrap gap-2" style="background-color: var(--ifpi-verde);">
            <h5 class="m-0 d-flex align-items-center gap-2">
                <i class="fas fa-history"></i> Terminal de Histórico
            </h5>
            <button class="btn btn-light btn-sm d-flex align-items-center gap-2 shadow-sm fw-bold" style="color: var(--ifpi-verde-escuro);" onclick="window.location.reload();">
                <i class="fas fa-sync-alt"></i> Atualizar
            </button>
        </div>

        <div class="card-body p-4 bg-light">
            
            <div class="input-group mb-4 shadow-sm" style="max-width: 500px;">
                <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                <!-- TEXTO DO PLACEHOLDER ATUALIZADO AQUI -->
                <input type="text" id="pesquisa-texto" class="form-control border-start-0 ps-0" placeholder="Buscar por chave ou setor...">
            </div>

            <div class="d-flex gap-2 mb-4 flex-wrap" id="container-filtros">
                <button class="btn btn-sm btn-success rounded-pill fw-semibold px-3 shadow-sm" onclick="filtrarHistorico('todos', this)">Todos</button>
                <button class="btn btn-sm btn-outline-secondary bg-white rounded-pill fw-semibold px-3 shadow-sm" onclick="filtrarHistorico('emprestimo', this)">🔵 Empréstimos</button>
                <button class="btn btn-sm btn-outline-secondary bg-white rounded-pill fw-semibold px-3 shadow-sm" onclick="filtrarHistorico('devolvido', this)">🟢 Devoluções</button>
                <button class="btn btn-sm btn-outline-secondary bg-white rounded-pill fw-semibold px-3 shadow-sm" onclick="filtrarHistorico('repassado', this)">🟠 Repasses</button>
            </div>

            <div class="d-flex flex-column gap-2" id="historicoFeed">
                <!-- O JavaScript irá inserir os dados aqui -->
            </div>
            
            <hr class="mt-5 mb-4">

            <div class="row g-2 justify-content-md-start">
                <div class="col-6 col-md-auto">
                    <a href="{% url 'operacao_rapida' %}" class="btn btn-secondary shadow-sm w-100 btn-lg d-flex justify-content-center align-items-center text-nowrap px-1 px-md-5">
                    <i class="fas fa-chevron-left me-1 me-md-2"></i> Voltar
                </a>
                </div>
            </div>
        </div>
    </div>
</div>

{{ movimentos_json|json_script:"movimentos-data" }}

<!-- Lembre-se de aumentar o 'v=' se o navegador não carregar o novo JS -->
<script src="{% static 'historico/historico.js' %}?v=3"></script>
{% endblock conteudo %}

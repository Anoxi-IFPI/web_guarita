{% extends "home/base.html" %}
{% load static %}
{% block titulo %}Devolução de Chaves{% endblock %}

{% block conteudo %}
<style>
    .input-grande {
        width: 100%; padding: 12px 20px; font-size: 1.8rem; font-weight: bold;
        text-align: center; color: #333; border: 2px solid #ccc; 
        border-radius: 8px; transition: all 0.3s ease; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        letter-spacing: 2px;
    }
    .input-grande:focus {
        border-color: var(--ifpi-verde, #28a745); box-shadow: 0 0 10px rgba(40, 167, 69, 0.3); outline: none;
    }
</style>

<div class="container-fluid mt-2"> 
    
    <!-- Painel de Identificação (Inicia oculto até a primeira chave ser lida) -->
    <div id="painel_usuario" class="card shadow mb-4 border-0 d-none">
        <div class="card-header py-3 text-white fw-bold" style="background-color: var(--ifpi-verde);">
            <h5 class="m-0"><i class="fas fa-user-check me-2"></i> Usuário Identificado</h5>
        </div>
        <div class="card-body p-4 bg-light">
            <div class="row text-center text-md-start">
                <div class="col-md-6 mb-2 mb-md-0">
                    <span class="text-muted d-block small">Titular Atual</span>
                    <strong class="fs-4" id="ui_usuario_nome">---</strong>
                </div>
                <div class="col-md-6">
                    <span class="text-muted d-block small">Matrícula Atual</span>
                    <strong class="fs-4 text-primary" id="ui_usuario_matricula">---</strong>
                </div>
            </div>
        </div>
    </div>
        
    <!-- Formulário e Leitura -->
    <div class="card shadow mb-4 border-0">
        <div class="card-body p-5">
            <form method="POST" action="{% url 'devolver_emprestimo' %}" id="formDevolucao">
                {% csrf_token %}
                
                <div class="mb-5 mt-2 text-center">
                    <label class="form-label fw-bold fs-4 text-dark mb-4">
                        Passe a Chave no Leitor ou digite o código para <span class="text-success">DEVOLVER</span>
                    </label>
                    <input type="text" id="input_leitor" class="input-grande" placeholder="Aguardando leitura do código..." autofocus autocomplete="off">
                </div>

                <!-- Lista Visual das Chaves Bipadas -->
                <div class="mb-5">
                    <h5 class="fw-bold text-secondary mb-3">Lista de Devolução:</h5>
                    <ul class="list-group" id="lista_chaves">
                        <!-- As chaves lidas aparecerão aqui via JS -->
                    </ul>
                </div>

                <hr class="mt-5 mb-4">

                <div class="d-flex justify-content-between align-items-center">
                    <a href="{% url 'listar_emprestimos' %}" class="btn btn-secondary shadow-sm px-4 text-white btn-lg">
                        <i class="fas fa-chevron-left me-2"></i> Voltar para Listagem
                    </a>
                    <button type="submit" class="btn btn-success px-5 shadow-sm btn-lg" style="background-color: var(--ifpi-verde-escuro);" id="btn_confirmar" disabled>
                        Confirmar Devolução <i class="fas fa-check-circle ms-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'emprestimos/js/devolver.js' %}"></script> 

{% endblock conteudo %}

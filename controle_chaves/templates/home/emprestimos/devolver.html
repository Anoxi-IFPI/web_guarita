{% extends "home/base.html" %}
{% load static %}
{% block titulo %}Devolução de Chaves{% endblock %}

{% block conteudo %}
<!--Arquivo local pasta de devolução estática-->
<link rel="stylesheet" href="{% static 'emprestimos/devolucao/devolver.css' %}">

<div class="container-fluid mt-2"> 
    
    <!-- Painel de Identificação (Inicia oculto até a primeira chave ser lida) -->
    <div id="painel_usuario" class="card shadow mb-4 border-0 d-none">
        <div class="card-header py-3 text-white fw-bold" style="background-color: var(--ifpi-verde);">
            <h5 class="m-0"><i class="fas fa-user-check me-2"></i> Usuário Identificado</h5>
        </div>
        <div class="card-body p-4 bg-light">
            <div class="row text-center text-md-start">
                <div class="col-md-6 mb-2 mb-md-0">
                    <span class="text-muted d-block small">Titular Atual</span>
                    <strong class="fs-4" id="ui_usuario_nome">---</strong>
                </div>
                <div class="col-md-6">
                    <span class="text-muted d-block small">Matrícula Atual</span>
                    <strong class="fs-4 text-primary" id="ui_usuario_matricula">---</strong>
                </div>
            </div>
        </div>
    </div>
        
    <!-- Formulário e Leitura -->
    <div class="card shadow mb-4 border-0">
        <div class="card-body p-5">
            <form method="POST" action="{% url 'devolver_emprestimo' %}" id="formDevolucao">
                {% csrf_token %}
                
                <div class="mb-5 mt-2 text-center">
                    <label class="form-label fw-bold fs-4 text-dark mb-4">
                        Passe a Chave no Leitor ou digite o código para <span class="text-success">DEVOLVER</span>
                    </label>
                    <!-- Importante: manter name="codigo" para o plano B -->
                    <input type="text" name="codigo" id="input_leitor" class="input-grande" placeholder="Aguardando leitura do código..." autofocus autocomplete="off">
                    <div id="alerta_container" class="mt-4"></div>
                </div>

                <div class="mb-5">
                    <h5 class="fw-bold text-secondary mb-3">Resumo das Chaves Devolvidas:</h5>
                    <ul class="list-group" id="lista_chaves">
                        <!-- As chaves devolvidas vão aparecer aqui com o status "Devolvida" -->
                    </ul>
                </div>

                <hr class="mt-5 mb-4">

                <!-- Botões responsivos: 50% cada no celular (col-6), lado a lado -->
                <div class="row g-2">
                    
                    <div class="col-6">
                        <a href="{% url 'listar_emprestimos' %}" class="btn btn-secondary shadow-sm w-100 btn-lg d-flex justify-content-center align-items-center text-nowrap px-1">
                            <i class="fas fa-chevron-left me-1 me-md-2"></i> Voltar
                        </a>
                    </div>
                    
                    <div class="col-6">
                        <button type="submit" class="btn btn-success shadow-sm w-100 btn-lg d-flex justify-content-center align-items-center text-nowrap px-1" style="background-color: var(--ifpi-verde-escuro);" id="btn_confirmar">
                            Confirmar <i class="fas fa-check-circle ms-1 ms-md-2"></i>
                        </button>
                    </div>
                    
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'emprestimos/devolucao/devolver.js' %}?v=2"></script>
{% endblock conteudo %}

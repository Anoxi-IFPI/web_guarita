{% extends "home/base.html" %}
{% load static %}
{% block titulo %}Realizar Empréstimo{% endblock %}

{% block conteudo %}
<!--arquivos staticos css local de forms -->
<link rel="stylesheet" href="{% static 'emprestimos/forms/forms.css' %}">

<!-- Usamos exatamente a mesma estrutura da listagem para manter a largura -->
<div class="container-fluid mt-2"> 
    <div class="card shadow mb-2 border-0">
        
        <div class="card-header py-3 text-white fw-bold" style="background-color: var(--ifpi-verde);">
            <h5 class="m-0 font-weight-bold">
                <i class="fas fa-id-card me-2"></i> Identificação do Usuário
            </h5>
        </div>
        
        <div class="card-body p-5 text-center">
            
            <form method="POST" action="">
                {% csrf_token %}
                
                <div class="mb-5 mt-4">
                    <label class="form-label fw-bold fs-4 text-dark mb-4">
                        Digite a sua Matrícula
                    </label>
                    
                    {{ form.matricula }}
                    
                    {% if form.matricula.errors %}
                        <div class="alert alert-danger mt-4 mb-0 py-2 d-inline-block fs-5">
                            <i class="fas fa-exclamation-circle"></i> {{ form.matricula.errors.0 }}
                        </div>
                    {% endif %}
                </div>

                <hr class="mt-5 mb-4">

                <!-- Botões responsivos: 50% cada no celular (col-6), lado a lado -->
                <div class="row g-2">
                    
                    <div class="col-6">
                        <!-- w-100 força preencher os 50%. d-flex centraliza ícone e texto na mesma linha -->
                        <a href="{% url 'listar_emprestimos' %}" class="btn btn-secondary shadow-sm w-100 btn-lg d-flex justify-content-center align-items-center text-nowrap px-1">
                            <i class="fas fa-chevron-left me-1 me-md-2"></i> Voltar
                        </a>
                    </div>
                    
                    <div class="col-6">
                        <button type="submit" class="btn btn-success shadow-sm w-100 btn-lg d-flex justify-content-center align-items-center text-nowrap px-1" style="background-color: var(--ifpi-verde-escuro);">
                            Continuar <i class="fas fa-chevron-right ms-1 ms-md-2"></i>
                        </button>
                    </div>
                    
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock conteudo %}

{% extends "home/base.html" %}

{% block titulo %}Realizar Empréstimo{% endblock %}

{% block conteudo %}
<style>
    /* Estilo exclusivo para o input do leitor de código de barras */
    .input-grande {
        width: 100%;
        padding: 12px 20px; 
        font-size: 1.8rem;   
        font-weight: bold;
        text-align: center;
        color: #333;
        border: 2px solid #ccc; 
        border-radius: 8px; 
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        letter-spacing: 2px;
    }
    
    .input-grande:focus {
        border-color: var(--ifpi-verde, #28a745);
        box-shadow: 0 0 10px rgba(40, 167, 69, 0.3);
        outline: none;
    }
</style>

<!-- Usamos exatamente a mesma estrutura da listagem para manter a largura -->
<div class="container-fluid mt-2"> 
    <div class="card shadow mb-2 border-0">
        
        <div class="card-header py-3 text-white fw-bold" style="background-color: var(--ifpi-verde);">
            <h5 class="m-0 font-weight-bold">
                <i class="fas fa-id-card me-2"></i> Identificação do Usuário
            </h5>
        </div>
        
        <div class="card-body p-5 text-center">
            
            <form method="POST" action="">
                {% csrf_token %}
                
                <div class="mb-5 mt-4">
                    <label class="form-label fw-bold fs-4 text-dark mb-4">
                        Digite a sua Matrícula
                    </label>
                    
                    {{ form.matricula }}
                    
                    {% if form.matricula.errors %}
                        <div class="alert alert-danger mt-4 mb-0 py-2 d-inline-block fs-5">
                            <i class="fas fa-exclamation-circle"></i> {{ form.matricula.errors.0 }}
                        </div>
                    {% endif %}
                </div>

                <hr class="mt-5 mb-4">

                <div class="d-flex justify-content-between align-items-center">
                    <a href="{% url 'listar_emprestimos' %}" class="btn btn-secondary shadow-sm px-4 text-white btn-lg">
                        <i class="fas fa-chevron-left me-2"></i> Voltar para Listagem
                    </a>
                    
                    <button type="submit" class="btn btn-success px-5 shadow-sm btn-lg" style="background-color: var(--ifpi-verde-escuro);">
                        Continuar <i class="fas fa-chevron-right ms-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock conteudo %}

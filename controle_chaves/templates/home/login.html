{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Web Guarita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { max-width: 400px; width: 100%; border-radius: 15px; border: none; }
        .btn-ifpi { background-color: #1b8c3e; color: white; font-weight: bold; }
        .btn-ifpi:hover { background-color: #146c2e; color: white; }
    </style>
</head>
<body>

    <div class="card shadow-lg login-card p-4">
        <div class="text-center mb-4">
            <i class="fas fa-key text-success" style="font-size: 3rem;"></i>
            <h3 class="mt-3 fw-bold">Minhas Chaves</h3>
            <p class="text-muted small">Faça login para gerenciar seus repasses</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} text-center py-2">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login_usuario' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Matrícula</label>
                <input type="text" name="matricula" class="form-control form-control-lg" placeholder="Digite sua matrícula" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold text-secondary">Senha</label>
                <input type="password" name="senha" class="form-control form-control-lg" placeholder="Sua matrícula novamente" required>
            </div>
            <button type="submit" class="btn btn-ifpi w-100 btn-lg shadow-sm">Entrar</button>
        </form>
    </div>

</body>
</html>

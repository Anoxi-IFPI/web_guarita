<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %} Gestão de Chaves {% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS carregado com v=2 para forçar a limpeza do cache -->
    <link rel="stylesheet" href="{% static 'home_adm/base/base.css' %}?v=2">
</head>
<body>

    {% include "home/menu.html" %}

    <div class="content" id="content">
        
        <nav class="navbar-ifpi">
            <div class="d-flex align-items-center">
                <button class="btn-toggle" id="toggle-sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <h5 class="mb-0 ms-3 fw-bold">Gestão de Chaves</h5>
            </div>
            
            <div class="nav-icons d-flex align-items-center">
                <a href="#" title="Mensagens"><i class="fas fa-envelope"></i></a>
                <a href="#" title="Notificações"><i class="fas fa-bell"></i></a>
                
                <a href="{% url 'operacao_rapida' %}" class="btn-voltar" title="Acessar Operação Rápida">
                    <i class="fas fa-arrow-left"></i> <span>Acesso Rápido</span>
                </a>
                
                <form method="post" action="#" class="m-0 p-0">
                    {% csrf_token %}
                    <button type="submit" class="btn-sair" title="Sair do Sistema">
                        <i class="fas fa-power-off"></i> <span>Sair</span>
                    </button>
                </form>
            </div>
        </nav>

        <!-- ÁREA RESTAURADA: Sem isso, as páginas ficam em branco -->
        <div class="container-fluid p-4">
            {% block conteudo %}{% endblock conteudo %}
        </div>

    </div> <!-- Fim da div content -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'home_adm/base/base.js' %}"></script>

</body>
</html>
